name: "[master] Release"

on:
  push:
    branches:
      - "master"
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - "artwork/**"
      - "wiki/**"

jobs:
  Build:
    uses: ./.github/workflows/build.yml

  Release:
    name: Draft latest release on GitHub
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./build/
          merge-multiple: true

      - name: Publish latest draft release on GitHub
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          draft: true
          title: Latest Release
          files: build/*

  GHCR:
    name: Publish latest build to GitHub Container Registry
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & Publish latest to GHCR
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
